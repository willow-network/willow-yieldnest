type StakingNodeCreated @entity {
  id: ID!
  nodeId: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: String!
}

type ValidatorRegistered @entity {
  id: ID!
  pubkey: String!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: String!
}

type Transfer @entity {
  id: ID!
  from: String!
  to: String!
  value: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: String!
}
