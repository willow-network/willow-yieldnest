# Reference indexer config for the YieldNest subgroves.
#
# Runs as a Willow indexer DID with a deterministic signing key derived from the
# DID. On your own network, create and fund your own indexer identity.
node_did = "did:willow:indexer-1"
public_key_id = "did:willow:indexer-1#key-1"

# Relative so it resolves on any machine.
grovedb_path = "./grovedb"

consensus_rpc_endpoint = "http://localhost:26657"

p2p_port = 30313
metrics_port = 9100
historical_query_port = 3051
grovedb_visualizer_port = 10310

max_concurrent_indexing = 8
storage_limit_gb = 100

# Only index this set. These IDs must match the manifests in ../subgroves/ and
# the dashboard's config.ts.
subgrove_filter = [
    "yieldnest-vaults-eth",
    "yieldnest-restaking-eth",
    "yieldnest-liquidity",
    "yieldnest-governance",
]

# Ethereum mainnet RPC endpoints. The public endpoint below is unauthenticated
# and rate-limited; for real throughput supply your own authenticated URL, e.g.
#   "https://eth-mainnet.g.alchemy.com/v2/<your-key>",
eth_rpc_endpoints = [
    "https://ethereum.publicnode.com",
]

# For subgroves on other chains (manifest chain_id != 1), add per-chain RPC
# endpoints here, keyed by EVM chain_id. Example:
#   [rpc_endpoints_per_chain]
#   "10"   = ["https://optimism.publicnode.com"]   # Optimism
#   "8453" = ["https://base.publicnode.com"]        # Base
