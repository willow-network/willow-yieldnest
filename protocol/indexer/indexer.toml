# YieldNest demo indexer — runs as did:willow:indexer-1 (pre-funded at genesis)
# with a deterministic signing key (sha256 of "did:willow:indexer-1" +
# "indexer-signing-key", per willow-indexer bin).

node_did = "did:willow:indexer-1"
public_key_id = "did:willow:indexer-1#key-1"

grovedb_path = "/Users/pauldelucia/Documents/Willow/willow-yieldnest/protocol/indexer/grovedb"

consensus_rpc_endpoint = "http://localhost:26657"

# Unique ports (avoid clash with the existing devnet indexers on 3042/30303/9090/10300)
p2p_port = 30313
metrics_port = 9100
historical_query_port = 3051
grovedb_visualizer_port = 10310

max_concurrent_indexing = 6
storage_limit_gb = 100

# Ethereum mainnet RPCs for YieldNest contracts. Public endpoints — rate-limited
# but fine for a demo. For production swap in Alchemy/Infura URLs.
eth_rpc_endpoints = [
    # Publicnode — unauthenticated, unlimited, handles concurrent pipelines.
    # Infura/Alchemy removed: the fallback rotation (PR #134) round-robins
    # to them whenever publicnode is slow, which burned through Infura's
    # daily credit quota overnight. We don't need paid fallbacks for a demo.
    "https://ethereum.publicnode.com",
]

# Per-chain RPC endpoints for non-Ethereum subgroves. Keys are EVM chain_ids.
# Used by subgroves whose manifest specifies chain_id != 1.
#
# Non-Ethereum chains don't have Helios-equivalent light clients on the
# validator, so submissions for these chains go through on the RPC-trusted
# path (event_proofs skipped, indexer is trust anchor). The dashboard should
# badge these rows as "RPC-verified" vs "beacon-chain-verified" for Ethereum.
[rpc_endpoints_per_chain]
# BNB Chain (chain_id 56) — ynBNB, ynBNBx, ynBTCk
"56" = ["https://bsc.publicnode.com", "https://rpc.ankr.com/bsc"]
# Optimism (chain_id 10) — ynETHx_op, ynBTCk_op (vaults-l2 subgrove)
"10" = ["https://optimism.publicnode.com", "https://mainnet.optimism.io"]
# Arbitrum One (chain_id 42161) — future L2 mirror vaults
"42161" = ["https://arbitrum-one.publicnode.com", "https://arb1.arbitrum.io/rpc"]
# Base (chain_id 8453) — future Coinbase L2 mirror vaults
"8453" = ["https://base.publicnode.com", "https://mainnet.base.org"]
# Polygon (chain_id 137) — stablecoin / RWA products
"137" = ["https://polygon-bor.publicnode.com", "https://polygon-rpc.com"]
